<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Кибернетический глаз · мобильная версия</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #0d1420 0%, #060a12 60%, #020408 100%);
    font-family: 'Courier New', monospace;
    cursor: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  * { cursor: none !important; }

  #eye-container {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 380px;
    height: 260px;
    filter: drop-shadow(0 30px 60px rgba(0, 200, 255, 0.25));
    perspective: 900px;
    touch-action: none;
  }

  /* Корпус */
  .eye-socket {
    position: absolute;
    inset: -22px -32px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: linear-gradient(160deg, #2a3240 0%, #1a2028 40%, #0e131a 100%);
    box-shadow:
      inset 0 2px 3px rgba(120, 200, 255, 0.25),
      inset 0 -4px 8px rgba(0, 0, 0, 0.9),
      inset 0 0 40px rgba(0, 150, 200, 0.15),
      0 0 0 1px rgba(80, 160, 200, 0.35),
      0 0 25px rgba(0, 180, 255, 0.2);
    overflow: hidden;
    transform-style: preserve-3d;
    transition: transform 0.2s ease-out;
  }

  .eye-socket::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 8% 15%, #4a5568 0 2.5px, #1a2028 2.5px 5px, transparent 5px),
      radial-gradient(circle at 92% 15%, #4a5568 0 2.5px, #1a2028 2.5px 5px, transparent 5px),
      radial-gradient(circle at 8% 85%, #4a5568 0 2.5px, #1a2028 2.5px 5px, transparent 5px),
      radial-gradient(circle at 92% 85%, #4a5568 0 2.5px, #1a2028 2.5px 5px, transparent 5px),
      radial-gradient(circle at 50% 5%, #3a4552 0 2px, #1a2028 2px 4px, transparent 4px),
      radial-gradient(circle at 50% 95%, #3a4552 0 2px, #1a2028 2px 4px, transparent 4px);
    pointer-events: none;
    z-index: 20;
  }

  .eye-socket::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, transparent 48%, rgba(0, 200, 255, 0.15) 49%, rgba(0, 200, 255, 0.15) 51%, transparent 52%),
      linear-gradient(0deg, transparent 48%, rgba(0, 200, 255, 0.1) 49%, rgba(0, 200, 255, 0.1) 51%, transparent 52%),
      linear-gradient(115deg, transparent 30%, rgba(200, 220, 240, 0.08) 30.5%, transparent 31%),
      linear-gradient(115deg, transparent 62%, rgba(200, 220, 240, 0.06) 62.4%, transparent 62.9%),
      linear-gradient(70deg, transparent 15%, rgba(200, 220, 240, 0.05) 15.4%, transparent 15.9%),
      radial-gradient(circle at 22% 30%, rgba(180, 200, 220, 0.25) 0 1px, transparent 2px),
      radial-gradient(circle at 76% 18%, rgba(180, 200, 220, 0.2) 0 1px, transparent 2px),
      radial-gradient(circle at 34% 72%, rgba(180, 200, 220, 0.22) 0 1px, transparent 2px),
      radial-gradient(circle at 88% 64%, rgba(180, 200, 220, 0.18) 0 1px, transparent 2px),
      radial-gradient(circle at 60% 88%, rgba(180, 200, 220, 0.2) 0 1px, transparent 2px);
    pointer-events: none;
    opacity: 0.9;
  }

  .inner-ring {
    position: absolute;
    left: 3%;
    right: 3%;
    top: 11%;
    bottom: 11%;
    border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
    box-shadow:
      0 0 0 2px rgba(0, 200, 255, 0.5),
      0 0 0 4px rgba(0, 80, 120, 0.4),
      0 0 18px rgba(0, 200, 255, 0.4),
      inset 0 0 20px rgba(0, 100, 150, 0.3);
    pointer-events: none;
    z-index: 4;
  }

  .sclera {
    position: absolute;
    left: 0;
    right: 0;
    top: 12%;
    bottom: 12%;
    border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
    background: radial-gradient(ellipse at 35% 32%,
      #e8f4ff 0%, #c8e0f0 25%, #9ec5dd 50%, #6a96b0 75%, #3a5a70 100%);
    overflow: hidden;
    box-shadow:
      inset 0 0 40px rgba(0, 100, 150, 0.5),
      inset 0 8px 25px rgba(0, 20, 40, 0.6),
      0 0 0 2px rgba(0, 80, 120, 0.6);
  }

  .sclera::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(0deg, transparent 0 18px, rgba(0, 180, 255, 0.12) 18px 19px),
      repeating-linear-gradient(90deg, transparent 0 22px, rgba(0, 180, 255, 0.1) 22px 23px);
    pointer-events: none;
    opacity: 0.8;
  }

  .sclera::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 40% 35%, rgba(255, 255, 255, 0.35), transparent 60%),
      radial-gradient(ellipse 80% 70% at 60% 70%, rgba(0, 30, 60, 0.35), transparent 65%),
      radial-gradient(ellipse 50% 25% at 50% 10%, rgba(0, 200, 255, 0.35), transparent 70%),
      radial-gradient(ellipse 40% 20% at 50% 90%, rgba(0, 150, 220, 0.2), transparent 70%),
      radial-gradient(ellipse 30px 2px at 12% 62%, rgba(220, 80, 80, 0.45), transparent 75%),
      radial-gradient(ellipse 24px 2px at 20% 52%, rgba(210, 75, 75, 0.35), transparent 75%),
      radial-gradient(ellipse 34px 2px at 84% 40%, rgba(215, 80, 80, 0.4), transparent 75%),
      radial-gradient(ellipse 26px 2px at 90% 54%, rgba(200, 70, 70, 0.32), transparent 75%),
      radial-gradient(ellipse 18px 1px at 78% 66%, rgba(210, 80, 80, 0.28), transparent 75%);
    pointer-events: none;
    animation: veinPulse 2.8s ease-in-out infinite;
  }

  @keyframes veinPulse {
    0%, 100% { opacity: 0.65; }
    50% { opacity: 1; }
  }

  .tear {
    position: absolute;
    left: 4%;
    bottom: 28%;
    width: 10px;
    height: 14px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: radial-gradient(circle at 40% 35%, rgba(220, 245, 255, 0.9), rgba(150, 210, 240, 0.4) 60%, transparent 85%);
    filter: blur(0.4px);
    z-index: 6;
    animation: tearShine 4s ease-in-out infinite;
  }

  @keyframes tearShine {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
  }

  .iris-wrap {
    position: absolute;
    width: 178px;
    height: 178px;
    left: 50%;
    top: 50%;
    margin-left: -89px;
    margin-top: -89px;
    will-change: transform;
    transform-style: preserve-3d;
  }

  .iris {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 50%,
      #0a2a40 0%, #0a4a70 15%, #0078a8 28%, #00a8d8 38%, #00c8f0 45%,
      #0090c0 55%, #006a9a 68%, #003050 82%, #001018 95%, #000208 100%);
    box-shadow:
      inset 0 0 30px rgba(0, 0, 0, 0.9),
      0 0 0 2px rgba(0, 180, 240, 0.7),
      0 0 22px rgba(0, 200, 255, 0.6),
      0 0 45px rgba(0, 150, 220, 0.3);
  }

  .iris::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.3) 0%, transparent 40%),
      radial-gradient(circle at 65% 70%, rgba(0, 20, 40, 0.55) 0%, transparent 55%),
      radial-gradient(circle at 50% 50%,
        transparent 0 18%,
        rgba(0, 240, 255, 0.5) 18% 18.8%,
        transparent 18.8% 28%,
        rgba(0, 200, 255, 0.35) 28% 28.8%,
        transparent 28.8% 40%,
        rgba(0, 240, 255, 0.3) 40% 40.8%,
        transparent 40.8% 55%,
        rgba(0, 180, 220, 0.25) 55% 55.8%,
        transparent 55.8% 72%,
        rgba(0, 240, 255, 0.3) 72% 72.8%,
        transparent 72.8% 100%);
    pointer-events: none;
  }

  .iris::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: repeating-conic-gradient(from 0deg,
      rgba(0, 240, 255, 0.6) 0deg 0.8deg, transparent 0.8deg 5deg);
    mask-image: radial-gradient(circle, transparent 22%, black 24%, black 92%, transparent 94%);
    -webkit-mask-image: radial-gradient(circle, transparent 22%, black 24%, black 92%, transparent 94%);
    pointer-events: none;
    opacity: 0.7;
  }

  .iris-reflection {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    pointer-events: none;
    background:
      radial-gradient(ellipse 35% 22% at 30% 25%, rgba(200, 240, 255, 0.55), transparent 70%),
      radial-gradient(ellipse 25% 15% at 75% 78%, rgba(0, 150, 220, 0.35), transparent 70%),
      radial-gradient(ellipse 15% 40% at 12% 60%, rgba(0, 120, 180, 0.25), transparent 70%);
    mix-blend-mode: screen;
    transition: transform 0.1s ease-out;
  }

  .ciliary-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: repeating-conic-gradient(from 0deg,
      rgba(0, 30, 50, 0.9) 0deg 2deg, transparent 2deg 4deg);
    mask-image: radial-gradient(circle, transparent 44%, black 46%, black 50%, transparent 52%);
    -webkit-mask-image: radial-gradient(circle, transparent 44%, black 46%, black 50%, transparent 52%);
    pointer-events: none;
    opacity: 0.8;
  }

  .limbal-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    box-shadow:
      inset 0 0 16px 8px rgba(0, 0, 0, 0.85),
      inset 0 0 4px 2px rgba(0, 200, 255, 0.3);
    pointer-events: none;
  }

  .iris-ring {
    position: absolute;
    width: 88px;
    height: 88px;
    left: 50%;
    top: 50%;
    margin-left: -44px;
    margin-top: -44px;
    border-radius: 50%;
    box-shadow:
      inset 0 0 22px rgba(0, 0, 0, 0.95),
      0 0 14px rgba(0, 200, 255, 0.55),
      0 0 0 1.5px rgba(0, 240, 255, 0.6);
    pointer-events: none;
  }

  .pupil {
    position: absolute;
    width: 76px;
    height: 76px;
    left: 50%;
    top: 50%;
    margin-left: -38px;
    margin-top: -38px;
    border-radius: 50%;
    background: radial-gradient(circle at 45% 40%,
      #050810 0%, #000000 30%, #000000 60%, #02060c 80%, #0a1520 100%);
    box-shadow:
      inset 0 0 18px #000,
      inset -2px -2px 8px rgba(0, 120, 180, 0.35),
      0 0 12px rgba(0, 200, 255, 0.3);
    overflow: hidden;
    will-change: transform;
  }

  .pupil::before {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    top: 50%;
    background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.9), transparent);
    box-shadow: 0 0 6px rgba(0, 240, 255, 0.9);
    animation: scan 3.5s ease-in-out infinite;
  }

  @keyframes scan {
    0%, 100% { top: 15%; opacity: 0.2; }
    50% { top: 85%; opacity: 1; }
  }

  .highlight { position: absolute; border-radius: 50%; pointer-events: none; }
  .highlight.h1 {
    width: 38px; height: 38px; left: 16%; top: 12%;
    background: radial-gradient(circle, rgba(220, 250, 255, 1) 0%, rgba(150, 230, 255, 0.7) 35%, rgba(0, 200, 255, 0.2) 65%, transparent 80%);
    filter: blur(0.8px);
  }
  .highlight.h2 {
    width: 14px; height: 14px; left: 66%; top: 66%;
    background: radial-gradient(circle, rgba(200, 245, 255, 0.95) 0%, rgba(100, 210, 255, 0.4) 55%, transparent 80%);
    filter: blur(0.5px);
  }
  .highlight.h3 {
    width: 7px; height: 7px; left: 58%; top: 20%;
    background: rgba(240, 252, 255, 1); filter: blur(0.3px);
  }
  .highlight.h4 {
    width: 5px; height: 5px; left: 28%; top: 64%;
    background: rgba(180, 240, 255, 0.85); filter: blur(0.4px);
  }

  /* ВЕКИ */
  .eyelid {
    position: absolute;
    left: 0; right: 0;
    z-index: 10;
    pointer-events: none;
    transition: transform 0.35s cubic-bezier(.6,.05,.3,1);
    overflow: hidden;
    transform-style: preserve-3d;
  }

  .eyelid.top {
    top: 10%;
    height: 56%;
    border-radius: 50% 50% 45% 45% / 70% 70% 40% 40%;
    transform-origin: center top;
    transform: scaleY(0);
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, transparent 12%),
      linear-gradient(160deg, #4a5568 0%, #3a4552 15%, #2a3240 45%, #1a2028 80%, #0e131a 100%);
    box-shadow:
      inset 0 -18px 30px rgba(0, 0, 0, 0.7),
      inset 0 10px 20px rgba(0, 120, 170, 0.2),
      inset 2px 0 4px rgba(0, 200, 255, 0.15),
      inset -2px 0 4px rgba(0, 200, 255, 0.15),
      0 4px 10px rgba(0, 0, 0, 0.5);
  }

  .eyelid.top::after {
    content: '';
    position: absolute;
    left: 4%; right: 4%; bottom: 0;
    height: 4px;
    background: linear-gradient(90deg,
      transparent 0%, rgba(0, 150, 220, 0.4) 8%, rgba(0, 200, 255, 0.9) 25%,
      rgba(120, 240, 255, 1) 50%, rgba(0, 200, 255, 0.9) 75%,
      rgba(0, 150, 220, 0.4) 92%, transparent 100%);
    border-radius: 50%;
    filter: blur(0.6px);
    box-shadow: 0 0 10px rgba(0, 220, 255, 0.9), 0 0 20px rgba(0, 200, 255, 0.5);
  }

  .eyelid.top::before {
    content: '';
    position: absolute;
    left: 10%; right: 10%; top: 12%;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(0, 180, 240, 0.6) 20%, rgba(0, 180, 240, 0.6) 80%, transparent);
    filter: blur(0.5px);
    box-shadow: 0 0 4px rgba(0, 180, 240, 0.5);
  }

  .eyelid.top .crease-inner {
    position: absolute;
    left: 15%; right: 15%; top: 32%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0, 150, 200, 0.35) 30%, rgba(0, 150, 200, 0.35) 70%, transparent);
    filter: blur(0.5px);
  }

  .eyelid.top .glint {
    position: absolute;
    left: 15%; top: 18%;
    width: 30%; height: 22%;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255, 255, 255, 0.15), transparent 70%);
    filter: blur(4px);
  }

  .upper-lid-shadow {
    position: absolute;
    left: 0; right: 0; top: 12%; height: 40%;
    background: linear-gradient(180deg,
      rgba(0, 10, 20, 0.75) 0%, rgba(0, 30, 50, 0.4) 35%,
      rgba(0, 80, 120, 0.1) 70%, transparent 100%);
    pointer-events: none; z-index: 5;
    border-radius: 50% 50% 40% 40% / 100% 100% 20% 20%;
    transition: opacity 0.35s;
  }

  .eyelid.bottom {
    bottom: 10%;
    height: 46%;
    border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
    transform-origin: center bottom;
    transform: scaleY(0);
    background:
      linear-gradient(0deg, rgba(255, 255, 255, 0.1) 0%, transparent 12%),
      linear-gradient(0deg, #4a5568 0%, #3a4552 15%, #2a3240 45%, #1a2028 80%, #0e131a 100%);
    box-shadow:
      inset 0 18px 30px rgba(0, 0, 0, 0.7),
      inset 0 -10px 20px rgba(0, 120, 170, 0.18),
      inset 2px 0 4px rgba(0, 200, 255, 0.12),
      inset -2px 0 4px rgba(0, 200, 255, 0.12),
      0 -4px 10px rgba(0, 0, 0, 0.5);
  }

  .eyelid.bottom::after {
    content: '';
    position: absolute;
    left: 8%; right: 8%; top: 0;
    height: 3px;
    background: linear-gradient(90deg,
      transparent 0%, rgba(0, 150, 220, 0.4) 12%, rgba(0, 200, 255, 0.8) 35%,
      rgba(120, 240, 255, 0.95) 50%, rgba(0, 200, 255, 0.8) 65%,
      rgba(0, 150, 220, 0.4) 88%, transparent 100%);
    border-radius: 50%;
    filter: blur(0.5px);
    box-shadow: 0 0 8px rgba(0, 200, 255, 0.8), 0 0 16px rgba(0, 180, 240, 0.4);
  }

  .eyelid.bottom::before {
    content: '';
    position: absolute;
    left: 12%; right: 12%; bottom: 15%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0, 150, 200, 0.3) 30%, rgba(0, 150, 200, 0.3) 70%, transparent);
    filter: blur(0.5px);
  }

  .lower-lid-shadow {
    position: absolute;
    left: 0; right: 0; bottom: 12%; height: 22%;
    background: linear-gradient(0deg,
      rgba(0, 20, 35, 0.6) 0%, rgba(0, 60, 90, 0.2) 55%, transparent 100%);
    pointer-events: none; z-index: 5;
    border-radius: 50% 50% 50% 50% / 20% 20% 80% 80%;
    transition: opacity 0.35s;
  }

  .eye-container.sleeping .eyelid.top { transform: scaleY(0.42); }
  .eye-container.sleeping .eyelid.bottom { transform: scaleY(0.32); }
  .eye-container.sleeping .upper-lid-shadow { opacity: 0.6; }

  .eye-container.closed .eyelid.top { transform: scaleY(1); }
  .eye-container.closed .eyelid.bottom { transform: scaleY(0.9); }

  /* HUD */
  .hud {
    position: absolute;
    inset: -50px;
    pointer-events: none;
    z-index: 1;
  }

  .scanner-svg {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 480px;
    height: 480px;
    margin-left: -240px;
    margin-top: -240px;
    opacity: 0.55;
    animation: rotateScan 20s linear infinite;
  }

  @keyframes rotateScan {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .scanner-svg .arc { fill: none; stroke: rgba(0, 200, 255, 0.6); stroke-width: 1.5; stroke-dasharray: 4 8; }
  .scanner-svg .arc2 {
    fill: none; stroke: rgba(0, 240, 255, 0.9); stroke-width: 2;
    stroke-dasharray: 60 240;
    filter: drop-shadow(0 0 4px rgba(0, 240, 255, 0.9));
  }
  .scanner-svg .tick { stroke: rgba(0, 200, 255, 0.5); stroke-width: 1.5; }

  .coords {
    position: fixed;
    left: calc(50% + 250px);
    top: calc(50% - 160px);
    color: rgba(0, 220, 255, 0.75);
    font-size: 12px;
    letter-spacing: 1.5px;
    line-height: 1.7;
    text-shadow: 0 0 6px rgba(0, 200, 255, 0.6);
    pointer-events: none;
    font-family: 'Courier New', monospace;
    white-space: nowrap;
  }
  .coords .label { color: rgba(0, 200, 255, 0.45); }

  .status {
    position: fixed;
    left: calc(50% - 250px);
    top: calc(50% - 160px);
    color: rgba(0, 220, 255, 0.75);
    font-size: 12px;
    letter-spacing: 1.5px;
    text-shadow: 0 0 6px rgba(0, 200, 255, 0.6);
    pointer-events: none;
    font-family: 'Courier New', monospace;
    text-align: right;
  }
  .status .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #00e0ff;
    box-shadow: 0 0 6px #00e0ff;
    margin-right: 6px;
    vertical-align: middle;
    animation: blinkDot 1.2s ease-in-out infinite;
  }
  @keyframes blinkDot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  /* ПРИЦЕЛ-МИШЕНЬ (заменяет курсор) */
  .target {
    position: fixed;
    width: 44px; height: 44px;
    left: 0; top: 0;
    margin-left: -22px; margin-top: -22px;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.9;
    transition: opacity 0.3s, transform 0.15s;
    will-change: transform, left, top;
  }

  .target svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .target .t-ring-outer {
    fill: none;
    stroke: rgba(0, 220, 255, 0.7);
    stroke-width: 1;
    stroke-dasharray: 3 5;
    transform-origin: center;
    animation: targetRing 8s linear infinite;
  }

  @keyframes targetRing {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .target .t-ring-mid {
    fill: none;
    stroke: rgba(0, 240, 255, 0.9);
    stroke-width: 1.5;
  }

  .target .t-cross {
    stroke: rgba(0, 240, 255, 0.95);
    stroke-width: 1.5;
    filter: drop-shadow(0 0 3px rgba(0, 220, 255, 0.9));
  }

  .target .t-dot {
    fill: rgba(0, 240, 255, 1);
    filter: drop-shadow(0 0 4px rgba(0, 240, 255, 1));
  }

  .target .t-corner {
    stroke: rgba(0, 220, 255, 0.85);
    stroke-width: 2;
    fill: none;
    filter: drop-shadow(0 0 3px rgba(0, 220, 255, 0.8));
  }

  .target.locked .t-ring-mid {
    stroke: rgba(255, 100, 100, 0.95);
    filter: drop-shadow(0 0 4px rgba(255, 100, 100, 0.9));
  }
  .target.locked .t-cross {
    stroke: rgba(255, 120, 120, 0.95);
  }
  .target.locked .t-dot {
    fill: rgba(255, 100, 100, 1);
    filter: drop-shadow(0 0 5px rgba(255, 100, 100, 1));
  }
  .target.locked .t-corner {
    stroke: rgba(255, 120, 120, 0.9);
  }
  .target.locked .t-ring-outer {
    stroke: rgba(255, 120, 120, 0.6);
  }

  .mini-radar {
    position: fixed;
    left: calc(50% - 250px);
    top: calc(50% + 130px);
    width: 90px; height: 90px;
    border-radius: 50%;
    border: 1px solid rgba(0, 200, 255, 0.4);
    box-shadow: 0 0 12px rgba(0, 200, 255, 0.2), inset 0 0 20px rgba(0, 100, 150, 0.15);
    background: radial-gradient(circle, rgba(0, 40, 60, 0.4) 0%, rgba(0, 15, 25, 0.6) 100%);
    pointer-events: none;
    overflow: hidden;
  }
  .mini-radar::before {
    content: ''; position: absolute; inset: 8px; border-radius: 50%;
    border: 1px solid rgba(0, 200, 255, 0.2);
  }
  .mini-radar::after {
    content: ''; position: absolute; inset: 20px; border-radius: 50%;
    border: 1px solid rgba(0, 200, 255, 0.15);
  }
  .mini-radar .sweep {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(0, 220, 255, 0.5), transparent 60deg, transparent 360deg);
    animation: radarSweep 3s linear infinite;
  }
  @keyframes radarSweep {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .mini-radar .blip {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #00e0ff;
    box-shadow: 0 0 6px #00e0ff;
    transform: translate(-50%, -50%);
    transition: left 0.1s, top 0.1s;
    left: 50%; top: 50%;
  }

  .activity {
    position: fixed;
    left: calc(50% + 250px);
    top: calc(50% + 90px);
    width: 140px;
    height: 50px;
    border: 1px solid rgba(0, 200, 255, 0.3);
    background: rgba(0, 20, 30, 0.3);
    box-shadow: inset 0 0 10px rgba(0, 100, 150, 0.15);
    pointer-events: none;
    overflow: hidden;
  }
  .activity .label {
    position: absolute;
    top: 2px; left: 6px;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: rgba(0, 200, 255, 0.5);
  }
  .activity svg { width: 100%; height: 100%; }
  .activity path {
    fill: none;
    stroke: rgba(0, 220, 255, 0.85);
    stroke-width: 1.5;
    filter: drop-shadow(0 0 3px rgba(0, 220, 255, 0.7));
  }

  .lock-label {
    position: fixed;
    left: 50%;
    top: calc(50% - 200px);
    transform: translateX(-50%);
    color: #00e0ff;
    font-size: 12px;
    letter-spacing: 4px;
    text-shadow: 0 0 8px rgba(0, 220, 255, 0.9);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    font-family: 'Courier New', monospace;
  }
  .lock-label.active { opacity: 1; }
  .lock-label::before, .lock-label::after {
    content: '【'; margin: 0 6px; color: rgba(0, 220, 255, 0.5);
  }
  .lock-label::after { content: '】'; }

  .session-timer {
    position: fixed;
    left: calc(50% - 250px);
    top: calc(50% + 90px);
    color: rgba(0, 200, 255, 0.6);
    font-size: 11px;
    letter-spacing: 1.5px;
    pointer-events: none;
    font-family: 'Courier New', monospace;
    text-shadow: 0 0 4px rgba(0, 200, 255, 0.4);
  }
  .session-timer .label { color: rgba(0, 200, 255, 0.4); }

  .log {
    position: fixed;
    left: calc(50% - 250px);
    top: calc(50% + 115px);
    width: 200px;
    color: rgba(0, 200, 255, 0.55);
    font-size: 10px;
    line-height: 1.6;
    letter-spacing: 0.5px;
    pointer-events: none;
    font-family: 'Courier New', monospace;
    text-shadow: 0 0 4px rgba(0, 200, 255, 0.3);
    max-height: 60px;
    overflow: hidden;
  }
  .log div { white-space: nowrap; }
  .log .time { color: rgba(0, 200, 255, 0.35); }

  .sound-btn {
    position: fixed;
    right: 20px; top: 20px;
    width: 38px; height: 38px;
    border: 1px solid rgba(0, 200, 255, 0.4);
    border-radius: 6px;
    background: rgba(0, 30, 40, 0.5);
    color: rgba(0, 220, 255, 0.8);
    font-size: 18px;
    cursor: none;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    transition: all 0.2s;
    font-family: 'Courier New', monospace;
  }
  .sound-btn:hover {
    background: rgba(0, 60, 80, 0.7);
    box-shadow: 0 0 12px rgba(0, 200, 255, 0.4);
  }
  .sound-btn.off {
    color: rgba(0, 200, 255, 0.3);
    border-color: rgba(0, 200, 255, 0.2);
  }

  .hint {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);
    color: rgba(0, 200, 255, 0.5);
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity 0.5s;
    font-family: 'Courier New', monospace;
    text-shadow: 0 0 8px rgba(0, 200, 255, 0.4);
    text-align: center;
    padding: 0 16px;
    white-space: nowrap;
  }

  /* ============ АДАПТАЦИЯ ПОД МОБИЛЬНЫЕ ============ */
  @media (max-width: 900px) {
    #eye-container {
      width: 300px;
      height: 210px;
    }
    .iris-wrap {
      width: 140px;
      height: 140px;
      margin-left: -70px;
      margin-top: -70px;
    }

      width: 70px;
      height: 70px;

    }

      width: 60px;

      margin-left: -30px;
      margin-top: -30px;
    }
    .highlight.h1 { width: 30px; height: 30px; }
    .highlight.h2 { width: 11px; height: 11px; }
    .highlight.h3 { width: 6px; height: 6px; }
    .highlight.h4 { width: 4px; height: 4px; }

    .coords {
      left: auto;
      right: 16px;
      top: 70px;
      font-size: 11px;
    }
    .status {
      left: 16px;
      right: auto;
      top: 70px;
      font-size: 11px;
      text-align: left;
    }
    .mini-radar {
      left: 16px;
      top: auto;
      bottom: 100px;
      width: 70px;
      height: 70px;
    }
    .session-timer {
      left: 16px;
      top: auto;
      bottom: 180px;
      font-size: 10px;
    }
    .log {
      left: 16px;
      top: auto;
      bottom: 60px;
      width: 160px;
      font-size: 9px;
      max-height: 70px;
    }
    .activity {
      right: 16px;
      left: auto;
      top: auto;
      bottom: 100px;
      width: 110px;
      height: 44px;
    }
    .lock-label {
      top: auto;
      bottom: 180px;
      left: 50%;
      right: auto;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 3px;
    }
    .sound-btn {
      width: 34px;
      height: 34px;

      right: 14px;
      top: 14px;
    }
    .hint {
      font-size: 11px;
      letter-spacing: 2px;
      bottom: 24px;
      white-space: normal;
      max-width: 90vw;
    }
    .scanner-svg {
      width: 380px;
      height: 380px;
      margin-left: -190px;
      margin-top: -190px;
    }
    .target {
      width: 36px;
      height: 36px;
      margin-left: -18px;

    }
  }

  @media (max-width: 500px) {
    #eye-container {
      width: 260px;
      height: 180px;
    }
    .iris-wrap {
      width: 120px;
      height: 120px;
      margin-left: -60px;
      margin-top: -60px;
    }
    .iris-ring {
      width: 60px;
      height: 60px;
      margin-left: -30px;
      margin-top: -30px;
    }
    .pupil {
      width: 52px;
      height: 52px;
      margin-left: -26px;
      margin-top: -26px;
    }
    .highlight.h1 { width: 26px; height: 26px; }
    .highlight.h2 { width: 9px; height: 9px; }
    .highlight.h3 { width: 5px; height: 5px; }
    .highlight.h4 { width: 4px; height: 4px; }

    .coords { top: 58px; font-size: 10px; }
    .status { top: 58px; font-size: 10px; }
    .mini-radar {
      bottom: 90px;
      width: 60px;
      height: 60px;
    }
    .session-timer { bottom: 160px; font-size: 9px; }
    .log {
      bottom: 55px;
      width: 140px;
      font-size: 8px;
      max-height: 55px;
    }
    .activity {
      bottom: 90px;
      width: 90px;
      height: 38px;
    }
    .lock-label {
      bottom: 160px;
      font-size: 10px;
      letter-spacing: 2px;
    }
    .sound-btn {
      width: 30px;
      height: 30px;
      font-size: 14px;

    }
    .hint {
      font-size: 10px;
      letter-spacing: 1.5px;
      bottom: 18px;
    }
    .scanner-svg {
      width: 340px;
      height: 340px;
      margin-left: -170px;
      margin-top: -170px;
    }
    .target {
      width: 32px;
      height: 32px;
      margin-left: -16px;
      margin-top: -16px;
    }
  }

  /* Ландшафтная ориентация телефона — скрываем лишнее */
  @media (max-height: 500px) and (orientation: landscape) {
    .mini-radar { display: none; }
    .activity { display: none; }
    .log { display: none; }
    .session-timer { display: none; }
    .coords { top: 12px; right: 12px; font-size: 10px; }
    .status { top: 12px; left: 12px; font-size: 10px; }
    .lock-label { bottom: 50px; }
    #eye-container { width: 280px; height: 190px; }
  }
</style>

<body>

<div class="hud">
  <svg class="scanner-svg" viewBox="0 0 480 480">
    <circle class="arc" cx="240" cy="240" r="220" />
    <circle class="arc2" cx="240" cy="240" r="220" />
    <g id="ticks"></g>
  </svg>
</div>

<div id="eye-container" class="eye-container">
  <div class="eye-socket" id="socket">
    <div class="inner-ring"></div>

    <div class="sclera">
      <div class="iris-wrap" id="iris-wrap">
        <div class="iris" id="iris">
          <div class="iris-reflection" id="iris-reflection"></div>
          <div class="limbal-ring"></div>
          <div class="ciliary-ring"></div>
          <div class="iris-ring"></div>
          <div class="pupil" id="pupil"></div>
          <div class="highlight h1"></div>
          <div class="highlight h2"></div>
          <div class="highlight h3"></div>
          <div class="highlight h4"></div>
        </div>
      </div>
      <div class="tear"></div>
    </div>

    <div class="upper-lid-shadow" id="upperShadow"></div>
    <div class="lower-lid-shadow" id="lowerShadow"></div>

    <div class="eyelid top" id="lidTop">
      <div class="glint"></div>
      <div class="crease-inner"></div>
    </div>
    <div class="eyelid bottom" id="lidBottom"></div>
  </div>
</div>

<div class="lock-label" id="lockLabel">TARGET LOCKED</div>

<div class="status" id="status">
  <div><span class="dot"></span>SYSTEM ONLINE</div>
  <div style="margin-top:6px; color: rgba(0,220,255,0.5);">MODE: <span id="modeVal">TRACK</span></div>
</div>

<div class="coords">
  <div><span class="label">X:</span> <span id="coordX">0000</span></div>
  <div><span class="label">Y:</span> <span id="coordY">0000</span></div>
  <div><span class="label">DIST:</span> <span id="coordD">0000</span></div>
</div>

<div class="mini-radar">
  <div class="sweep"></div>
  <div class="blip" id="blip"></div>
</div>

<div class="session-timer">
  <span class="label">ACTIVE:</span> <span id="timer">00:00</span>
</div>

<div class="log" id="log"></div>

<div class="activity">
  <div class="label">ACTIVITY</div>
  <svg id="activitySvg" viewBox="0 0 140 50" preserveAspectRatio="none">
    <path id="activityPath" d="" />
  </svg>
</div>

<!-- ПРИЦЕЛ вместо курсора -->
<div class="target" id="target">
  <svg viewBox="0 0 44 44">
    <circle class="t-ring-outer" cx="22" cy="22" r="19" />
    <circle class="t-ring-mid" cx="22" cy="22" r="11" />
    <line class="t-cross" x1="22" y1="1" x2="22" y2="10" />
    <line class="t-cross" x1="22" y1="34" x2="22" y2="43" />
    <line class="t-cross" x1="1" y1="22" x2="10" y2="22" />
    <line class="t-cross" x1="34" y1="22" x2="43" y2="22" />
    <path class="t-corner" d="M 3 9 L 3 3 L 9 3" />
    <path class="t-corner" d="M 35 3 L 41 3 L 41 9" />
    <path class="t-corner" d="M 41 35 L 41 41 L 35 41" />
    <path class="t-corner" d="M 9 41 L 3 41 L 3 35" />
    <circle class="t-dot" cx="22" cy="22" r="1.8" />
  </svg>
</div>

<button class="sound-btn" id="soundBtn" title="Звук">♪</button>

<div class="hint" id="hint">Клик/тап по глазу — закрыть · Shift — фонарик · Движение — разбудить</div>

<script>
  const container = document.getElementById('eye-container');
  const socket = document.getElementById('socket');
  const irisWrap = document.getElementById('iris-wrap');
  const irisReflection = document.getElementById('iris-reflection');
  const pupil = document.getElementById('pupil');
  const hint = document.getElementById('hint');
  const target = document.getElementById('target');
  const coordX = document.getElementById('coordX');
  const coordY = document.getElementById('coordY');
  const coordD = document.getElementById('coordD');
  const modeVal = document.getElementById('modeVal');
  const blip = document.getElementById('blip');
  const ticks = document.getElementById('ticks');
  const timerEl = document.getElementById('timer');
  const logEl = document.getElementById('log');
  const lockLabel = document.getElementById('lockLabel');
  const activityPath = document.getElementById('activityPath');
  const soundBtn = document.getElementById('soundBtn');
  const upperShadow = document.getElementById('upperShadow');
  const lowerShadow = document.getElementById('lowerShadow');

  const MAX_OFFSET = 60;
  const CLOSE_RADIUS = 220;
  const SLEEP_AFTER = 15000;

  const CONFIG = {
    lerpSpeed: 0.18,
    microTremor: 0.35,
    microTremorSpeed: 0.09,
    saccadeIntervalMin: 2200,
    saccadeIntervalMax: 5000,
    pupilBase: 76,
    pupilDilated: 92,
    pupilConstricted: 62,
    pupilLerp: 0.08,
    breathingPeriod: 5000,
  };

  let eyeCenter = { x: 0, y: 0 };
  let closed = false;
  let hintHidden = false;
  let sleeping = false;

  let eyePos = { x: 0, y: 0 };
  let eyeTarget = { x: 0, y: 0 };

  let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  let lastMoveTime = performance.now();

  let nextSaccade = performance.now() + 3000;
  let saccadeOffset = { x: 0, y: 0 };

  let pupilSize = CONFIG.pupilBase;
  let pupilTarget = CONFIG.pupilBase;

  let breathStart = performance.now();
  let sessionStart = performance.now();
  let shiftHeld = false;
  let mouseHeld = false;

  const activityData = new Array(60).fill(0);
  let lastActivitySample = performance.now();

  const logs = [];

  let audioCtx = null;
  let soundOn = true;

  // === Инициализация аудио ===
  function initAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function beep(freq = 660, dur = 0.08, vol = 0.04, type = 'sine') {
    if (!soundOn || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  }

  function logEvent(msg) {
    const t = performance.now();
    const elapsed = Math.floor((t - sessionStart) / 1000);
    const mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const ss = String(elapsed % 60).padStart(2, '0');
    logs.unshift({ time: `${mm}:${ss}`, msg });
    if (logs.length > 4) logs.pop();
    logEl.innerHTML = logs.map(l =>
      `<div><span class="time">[${l.time}]</span> ${l.msg}</div>`
    ).join('');
  }

  function updateCenter() {
    const rect = container.getBoundingClientRect();
    eyeCenter.x = rect.left + rect.width / 2;
    eyeCenter.y = rect.top + rect.height / 2;
  }

  function buildTicks() {
    const cx = 240, cy = 240, r = 220;
    for (let i = 0; i < 60; i++) {
      const a = (i / 60) * Math.PI * 2;
      const long = i % 5 === 0;
      const r1 = r - (long ? 12 : 6);
      const x1 = cx + Math.cos(a) * r1;
      const y1 = cy + Math.sin(a) * r1;
      const x2 = cx + Math.cos(a) * r;
      const y2 = cy + Math.sin(a) * r;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1);
      line.setAttribute('y1', y1);
      line.setAttribute('x2', x2);
      line.setAttribute('y2', y2);
      line.setAttribute('class', 'tick');
      ticks.appendChild(line);
    }
  }

  function lerp(a, b, t) { return a + (b - a) * t; }

  // === Движение (мышь + тач) ===
  function handleMove(x, y) {
    mouse.x = x;
    mouse.y = y;
    lastMoveTime = performance.now();

    // Пробуждение
    if (sleeping) {
      sleeping = false;
      container.classList.remove('sleeping');
      logEvent('WAKE');
      beep(880, 0.06, 0.03);
    }

    // Прицел следует за курсором/пальцем
    target.style.left = x + 'px';
    target.style.top = y + 'px';

    coordX.textContent = String(Math.round(x)).padStart(4, '0');
    coordY.textContent = String(Math.round(y)).padStart(4, '0');

    updateCenter();
    const dx = x - eyeCenter.x;
    const dy = y - eyeCenter.y;
    const dist = Math.hypot(dx, dy);
    coordD.textContent = String(Math.round(dist)).padStart(4, '0');

    const maxDist = 500;
    const ndx = Math.max(-1, Math.min(1, dx / maxDist));
    const ndy = Math.max(-1, Math.min(1, dy / maxDist));
    blip.style.left = (50 + ndx * 38) + '%';
    blip.style.top = (50 + ndy * 38) + '%';

    // LOCK
    const locked = dist < CLOSE_RADIUS;
    target.classList.toggle('locked', locked);
    if (locked && !lockLabel.classList.contains('active')) {
      lockLabel.classList.add('active');
      logEvent('TARGET LOCKED');
    } else if (!locked && lockLabel.classList.contains('active')) {
      lockLabel.classList.remove('active');
      logEvent('LOCK LOST');
    }

    if (!closed) {
      const angle = Math.atan2(dy, dx);
      const limited = Math.min(dist, MAX_OFFSET);
      eyeTarget.x = Math.cos(angle) * limited * 1.15;
      eyeTarget.y = Math.sin(angle) * limited * 0.82;
    }

    if (!hintHidden && dist < 450) {
      hintHidden = true;
      hint.style.opacity = '0';
    }
  }

  function onMouseMove(e) {
    handleMove(e.clientX, e.clientY);
  }

  function onTouchMove(e) {
    if (e.touches[0]) {
      handleMove(e.touches[0].clientX, e.touches[0].clientY);
    }
  }

  // === Главный цикл ===
  let lastFrame = performance.now();

  function animate(now) {
    const dt = now - lastFrame;
    lastFrame = now;

    // Саккады
    if (!closed && !sleeping && now - lastMoveTime > 800) {
      if (now > nextSaccade) {
        const angle = Math.random() * Math.PI * 2;
        const r = 12 + Math.random() * 18;
        saccadeOffset.x = Math.cos(angle) * r;
        saccadeOffset.y = Math.sin(angle) * r * 0.7;
        nextSaccade = now + CONFIG.saccadeIntervalMin + Math.random() * (CONFIG.saccadeIntervalMax - CONFIG.saccadeIntervalMin);
        setTimeout(() => {
          saccadeOffset.x *= 0.3;
          saccadeOffset.y *= 0.3;
        }, 250);
      }
    } else {
      saccadeOffset.x *= 0.9;
      saccadeOffset.y *= 0.9;
    }

    const t = now * 0.001;
    const tremorX = Math.sin(t * CONFIG.microTremorSpeed * 10) * CONFIG.microTremor
                  + Math.sin(t * 1.7) * CONFIG.microTremor * 0.5;
    const tremorY = Math.cos(t * CONFIG.microTremorSpeed * 11) * CONFIG.microTremor
                  + Math.cos(t * 2.3) * CONFIG.microTremor * 0.5;

    const heldTremor = mouseHeld ? 3 : 0;
    const heldX = mouseHeld ? (Math.random() - 0.5) * heldTremor : 0;
    const heldY = mouseHeld ? (Math.random() - 0.5) * heldTremor : 0;

    const targetX = eyeTarget.x + saccadeOffset.x + tremorX + heldX;
    const targetY = eyeTarget.y + saccadeOffset.y + tremorY + heldY;

    eyePos.x = lerp(eyePos.x, targetX, CONFIG.lerpSpeed);
    eyePos.y = lerp(eyePos.y, targetY, CONFIG.lerpSpeed);

    irisWrap.style.transform = `translate3d(${eyePos.x}px, ${eyePos.y}px, 0)`;
    irisReflection.style.transform = `translate(${-eyePos.x * 0.3}px, ${-eyePos.y * 0.3}px)`;

    // Зрачок
    const idle = now - lastMoveTime;
    if (closed) {
      pupilTarget = CONFIG.pupilConstricted;
    } else if (shiftHeld) {
      pupilTarget = CONFIG.pupilConstricted;
    } else if (sleeping || idle > 3000) {
      pupilTarget = CONFIG.pupilDilated;
    } else {
      pupilTarget = CONFIG.pupilBase;
    }
    pupilSize = lerp(pupilSize, pupilTarget, CONFIG.pupilLerp);
    pupil.style.transform = `scale(${pupilSize / CONFIG.pupilBase})`;

    // Дыхание + параллакс
    const breath = 1 + Math.sin((now - breathStart) / CONFIG.breathingPeriod * Math.PI * 2) * 0.004;
    const rotX = -eyePos.y * 0.02;
    const rotY = eyePos.x * 0.04;
    socket.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) scale(${breath})`;

    // Сон
    if (!closed && !sleeping && idle > SLEEP_AFTER) {
      sleeping = true;
      container.classList.add('sleeping');
      logEvent('SLEEP');
      beep(440, 0.1, 0.03, 'sine');
    }

    if (closed) {
      modeVal.textContent = 'CLOSED';
    } else if (sleeping) {
      modeVal.textContent = 'SLEEP';
    } else if (idle > 3000) {
      modeVal.textContent = 'IDLE';
    } else if (now - lastMoveTime < 100) {
      modeVal.textContent = 'TRACK';
    } else {
      modeVal.textContent = 'SCAN';
    }

    // Таймер
    const elapsed = Math.floor((now - sessionStart) / 1000);
    const mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const ss = String(elapsed % 60).padStart(2, '0');
    timerEl.textContent = `${mm}:${ss}`;

    // Активность
    if (now - lastActivitySample > 150) {
      lastActivitySample = now;
      const speed = Math.min(1, Math.hypot(eyePos.x - targetX, eyePos.y - targetY) * 0.05 + (now - lastMoveTime < 300 ? 0.6 : 0));
      activityData.push(speed);
      activityData.shift();
      const pathD = activityData.map((v, i) => {
        const x = (i / (activityData.length - 1)) * 140;
        const y = 48 - v * 44;
        return `${i === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
      }).join(' ');
      activityPath.setAttribute('d', pathD);
    }

    requestAnimationFrame(animate);
  }

  // === Взаимодействие ===
  function closeEye() {
    if (closed) return;
    closed = true;
    mouseHeld = true;
    container.classList.add('closed');
    container.classList.remove('sleeping');
    sleeping = false;
    pupilTarget = CONFIG.pupilConstricted;
    initAudio();
    beep(520, 0.06, 0.04);
    logEvent('CLOSE');
  }

  function openEye() {
    if (!closed) return;
    closed = false;
    mouseHeld = false;
    container.classList.remove('closed');
    logEvent('OPEN');
  }

  container.addEventListener('mousedown', (e) => {
    e.preventDefault();
    closeEye();
  });

  container.addEventListener('touchstart', (e) => {
    e.preventDefault();
    closeEye();
    if (e.touches[0]) handleMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });

  window.addEventListener('mouseup', () => openEye());
  window.addEventListener('touchend', () => openEye());

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Shift') {
      shiftHeld = true;
      logEvent('LIGHT MODE');
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'Shift') shiftHeld = false;
  });

  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('touchmove', onTouchMove, { passive: true });

  window.addEventListener('resize', () => {
    updateCenter();
    updateTargetSize();
  });

  window.addEventListener('orientationchange', () => {
    setTimeout(() => { updateCenter(); updateTargetSize(); }, 200);
  });

  // Адаптивный размер прицела
  function updateTargetSize() {
    const w = window.innerWidth;
    let size = 44;
    if (w < 500) size = 32;
    else if (w < 900) size = 36;
    target.style.width = size + 'px';
    target.style.height = size + 'px';
    target.style.marginLeft = (-size/2) + 'px';
    target.style.marginTop = (-size/2) + 'px';
  }

  // Скрытие прицела, если мыши нет (тач), через CSS уже не показываем, но всё же
  // При тач-событии прицел есть — он следует за пальцем.

  // Звук
  soundBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    soundOn = !soundOn;
    soundBtn.classList.toggle('off', !soundOn);
    soundBtn.textContent = soundOn ? '♪' : '×';
    if (soundOn) initAudio();
  });
  soundBtn.addEventListener('touchstart', (e) => {
    e.stopPropagation();
    soundOn = !soundOn;
    soundBtn.classList.toggle('off', !soundOn);
    soundBtn.textContent = soundOn ? '♪' : '×';
    if (soundOn) initAudio();
    e.preventDefault();
  }, { passive: false });

  // Клик мимо глаза — рывок
  window.addEventListener('mousedown', (e) => {
    if (container.contains(e.target)) return;
    updateCenter();
    const dx = e.clientX - eyeCenter.x;
    const dy = e.clientY - eyeCenter.y;
    const dist = Math.hypot(dx, dy);
    const angle = Math.atan2(dy, dx);
    const limited = Math.min(dist, MAX_OFFSET);
    eyeTarget.x = Math.cos(angle) * limited * 1.15;
    eyeTarget.y = Math.sin(angle) * limited * 0.82;
    eyePos.x = eyeTarget.x * 0.4;
    eyePos.y = eyeTarget.y * 0.4;
  });

  // Начальная позиция прицела
  target.style.left = (window.innerWidth / 2) + 'px';
  target.style.top = (window.innerHeight / 2) + 'px';

  // Инициализация
  buildTicks();
  updateCenter();
  updateTargetSize();

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) {
    CONFIG.microTremor = 0;
  }

  logEvent('SYSTEM INIT');
  requestAnimationFrame(animate);

  // Предотвращаем скролл/зум на мобильных
  document.addEventListener('touchmove', (e) => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  document.addEventListener('gesturestart', (e) => e.preventDefault());
</script>

</body>
